# Гиперпараметры зафиксированы до оценки на тесте; чувствительность STF к ним показана в отчёте.
stf:
  lam_region: 0.5     # доля сезонного профиля региона (0: общий профиль категории)
  lam_mo: 0.3         # доля собственного профиля МО
  k_level: 2          # число последних месяцев для оценки уровня
  k_growth: 3         # число последних месяцев для оценки годового прироста
  beta_trend: 0.0     # собственный тренд МО (выключен: на одном году истории он вредит)
  w_nat: 0.0          # доля национального профиля СберИндекса при наличии панельного
stf_lgbm:
  first_origin_idx: 11            # обучение только на точках с полным годом истории (с 2023-12)
  retrain_idx: [12, 14, 16, 18, 20]   # переобучение раз в 2 месяца
  train_frac: 0.5                 # доля рядов в обучении (ограничение памяти)
  params: {objective: l1, learning_rate: 0.05, num_leaves: 31, min_child_samples: 200,
           feature_fraction: 0.8, bagging_fraction: 0.8, bagging_freq: 1, lambda_l2: 1.0,
           n_estimators: 400, verbose: -1, seed: 0}
prophet:
  default: {}                                  # Prophet() с настройками по умолчанию
  tuned: {yearly_seasonality: 3, seasonality_mode: multiplicative, changepoint_prior_scale: 0.01}
ensemble:
  damp: [0.8, 0.9, 0.95]     # затухание роста φ: g_h = a + (g - a)·φ^h, a: средний рост нац. ряда за anchor_years
  k_growth: [1, 3, 6]        # окно оценки текущего роста, мес.
  anchor_years: 3
  lam_growth_region: 0.5    # доля собственного прироста региона (при истории от 13 мес.)
  damp_direct_only: false   # true: затухание только для категорий с прямым нац. аналогом
  members_dir: members_v5
  foundation_members: [chronos2_extended, timesfm25_extended]   # режим с удлинённым контекстом
