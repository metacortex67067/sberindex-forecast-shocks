# Новости v2: LLM-разметка (GPU)
model: Qwen/Qwen2.5-7B-Instruct-AWQ
quantization: awq                      # null для неквантованной модели
tensor_parallel: 1                     # 7B-AWQ помещается в одну T4
max_model_len: 4096
batch: 2048
start: "2022-01-01"
end: "2024-12-31"
# широкий словарный фильтр перед LLM, чтобы не тратить GPU на спорт и рекламу
prefilter: "паводк|наводнен|подтоп|затоп|пожар|возгоран|горит|загорел|чс\\b|чрезвычайн|бпла|беспилот|дрон|обстрел|ракетн|взрыв|теракт|эвакуа|отключ|обесточ|без света|без тепла|без воды|авари|обрушен|выброс|утечк|разлив|перекрыт|аэропорт|ураган|смерч|снегопад|ливн|метел|гололед|мороз|жар[аы]|карантин|вспышк|отравлен|закрыт|банкрот|увольнен|сокращени|простой|погиб|пострада"
